version: "3.9"

# ── Production docker-compose ─────────────────────────────────────────────────
# Run on EC2. PostgreSQL is on RDS (external), not in this compose.
# ChromaDB runs as a container on the same EC2 instance.
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d

services:

  # ── ChromaDB ────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: erp_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=FALSE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - APP_ENV=production
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000         # internal Docker network port
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s          # give LangGraph time to initialise

  # ── Streamlit UI ─────────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: erp_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_URL=http://api:8000  # internal Docker network
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
